<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
</head>
<body>

    <!-- 1. PHẦN GIAO DIỆN (HTML) -->
    <h2>Đăng nhập dành cho nhân viên</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Tên đăng nhập" required>
        <br><br>
        <input type="password" id="password" placeholder="Mật khẩu" required>
        <br><br>
        
        <!-- Dòng chữ báo lỗi (Mặc định bị ẩn đi) -->
        <div id="errorMessage" style="color: red; display: none; margin-bottom: 10px;"></div>
        
        <button type="submit" id="loginBtn">Đăng nhập</button>
    </form>

    <!-- 2. PHẦN LIÊN KẾT VỚI API DÙNG CHUNG -->
    <!-- Gọi file api.js mà bạn đã tạo ở bước 1 vào đây -->
    <script src="api.js"></script>


    <!-- 3. PHẦN XỬ LÝ LOGIC KHI BẤM NÚT (JAVASCRIPT) -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Ngăn trình duyệt tự tải lại trang khi bấm submit
            
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');
            
            // Khóa nút để tránh khách bấm 2 lần liên tục
            btn.disabled = true;
            btn.innerText = "Đang xử lý...";
            errorDiv.style.display = 'none';

            // Lấy thông tin user vừa nhập
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                // Gọi API gửi xuống Backend
                const { response, data } = await apiRequest('/api/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                // Kiểm tra kết quả Backend trả về
                if (!response.ok) { 
                    // Nếu lỗi (Sai pass, thiếu thông tin...) -> Hiện chữ đỏ
                    errorDiv.innerText = data.message || "Đăng nhập thất bại";
                    errorDiv.style.display = 'block';
                } else if (data.must_change_password) {
                    // Nếu Backend bắt đổi mật khẩu -> Chuyển sang trang đổi MK
                    window.location.href = '/change-password.html'; 
                } else {
                    // Nếu thành công -> Chuyển vào trang chính nội bộ
                    window.location.href = '/index.html'; 
                }
            } catch (error) {
                // Nếu Backend bị sập hoặc mất mạng
                errorDiv.innerText = "Lỗi kết nối mạng hoặc máy chủ không phản hồi.";
                errorDiv.style.display = 'block';
            } finally {
                // Xử lý xong thì mở khóa nút lại như cũ
                btn.disabled = false;
                btn.innerText = "Đăng nhập";
            }
        });
    </script>
</body>
</html>
