<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đổi mật khẩu · Đặt phòng</title><link rel="stylesheet" href="style.css">
</head>
<body><main class="auth"><div class="card">
    <h1>Đổi mật khẩu lần đầu</h1>
    <p class="muted">Đặt mật khẩu riêng trước khi sử dụng chức năng đặt phòng.</p>
    <p id="message" role="status">Đang kiểm tra phiên…</p>
    <form id="changeForm" hidden>
        <label>Mật khẩu mới<input name="new_password" type="password" autocomplete="new-password" required></label>
        <label>Nhập lại mật khẩu<input name="confirm_password" type="password" autocomplete="new-password" required></label>
        <button type="submit">Lưu mật khẩu</button>
    </form>
    <button id="exitButton" class="secondary" type="button">Đăng xuất</button>
</div></main><script src="api.js"></script><script src="auth.js"></script></body>
</html>
