<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập · Đặt phòng</title><link rel="stylesheet" href="style.css">
</head>
<body><main class="auth"><div class="card">
    <h1>Đăng nhập nhân viên</h1>
    <p class="muted">Ứng dụng nội bộ quản lý đặt phòng.</p>
    <p id="message" role="status">Đang kiểm tra phiên…</p>
    <form id="loginForm" hidden>
        <label>Tên đăng nhập<input name="username" autocomplete="username" required></label>
        <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Đăng nhập</button>
    </form>
</div></main><script src="api.js"></script><script src="auth.js"></script></body>
</html>
