<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Đổi mật khẩu bắt buộc</h2>
        <form id="changePassForm">
            <div class="form-group">
                <label for="new_password">Mật khẩu mới:</label>
                <input type="password" id="new_password" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Nhập lại mật khẩu:</label>
                <input type="password" id="confirm_password" autocomplete="new-password" required>
            </div>
            <div id="errorMsg" class="error-msg" style="display: none;"></div>
            <button type="submit" id="submitBtn">Xác nhận đổi</button>
        </form>
    </div>

    <script src="api.js"></script>
    <script>
        // Kiểm tra quyền truy cập trước khi hiện form
        async function checkAccess() {
            const { response, data } = await apiRequest('/api/session/');
            if (response.status === 401 || data.code === 'AUTHENTICATION_REQUIRED') {
                window.location.href = '/login.html';
            } else if (!data.must_change_password) {
                window.location.href = '/index.html';
            }
        }
        checkAccess();

        document.getElementById('changePassForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMsg');
            
            btn.disabled = true;
            btn.innerText = "Đang lưu...";
            errorDiv.style.display = 'none';

            const new_password = document.getElementById('new_password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            try {
                const { response, data } = await apiRequest('/api/change-password/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_password, confirm_password })
                });

                if (!response.ok) {
                    // Bắt lỗi mật khẩu không khớp hoặc trống
                    if (data.code === 'PASSWORD_MISMATCH' || data.code === 'PASSWORD_REQUIRED' || data.code === 'INVALID_JSON') {
                        errorDiv.innerText = data.message;
                        errorDiv.style.display = 'block';
                    } else if (data.code === 'AUTHENTICATION_REQUIRED') {
                        window.location.href = '/login.html';
                    } else {
                        errorDiv.innerText = data.message || "Lỗi cập nhật.";
                        errorDiv.style.display = 'block';
                    }
                } else {
                    // Thành công thì dùng HTML để báo thay vì alert (tùy chọn hiện 1 dòng xanh rồi chuyển trang)
                    window.location.href = '/index.html';
                }
            } catch (error) {
                errorDiv.innerText = "Lỗi kết nối mạng.";
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "Xác nhận đổi";
            }
        });
    </script>
</body>
</html>
