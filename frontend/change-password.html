<!-- change-password.html -->
<h2>Đổi mật khẩu bắt buộc</h2>
<form id="changePassForm">
    <input type="password" id="new_password" placeholder="Mật khẩu mới" required>
    <input type="password" id="confirm_password" placeholder="Nhập lại mật khẩu mới" required>
    <div id="errorMsg" style="color: red; display: none;"></div>
    <button type="submit" id="submitBtn">Xác nhận đổi</button>
</form>
<script src="api.js"></script>
<script>
document.getElementById('changePassForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errorDiv = document.getElementById('errorMsg');
    btn.disabled = true;

    const new_password = document.getElementById('new_password').value;
    const confirm_password = document.getElementById('confirm_password').value;

    const { response, data } = await apiRequest('/api/change-password/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ new_password, confirm_password })
    });

    if (!response.ok) {
        errorDiv.innerText = data.message;
        errorDiv.style.display = 'block';
        btn.disabled = false;
    } else {
        alert("Đổi mật khẩu thành công!");
        window.location.href = '/index.html';
    }
});
</script>
